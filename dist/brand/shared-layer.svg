<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Shared layer between autonomous institutions</title>
  <desc id="desc">Three independent institutional blocks are crossed by one shared open layer.</desc>
  <rect width="720" height="520" fill="#EEF5F2"/>
  <g fill="#fff" stroke="#C9D3D0" stroke-width="2">
    <rect x="58" y="86" width="164" height="320"/>
    <rect x="278" y="54" width="164" height="352"/>
    <rect x="498" y="112" width="164" height="294"/>
  </g>
  <g fill="#172B3A">
    <rect x="82" y="116" width="68" height="8" rx="4"/>
    <rect x="302" y="84" width="68" height="8" rx="4"/>
    <rect x="522" y="142" width="68" height="8" rx="4"/>
  </g>
  <g fill="#D7E8E1">
    <rect x="82" y="150" width="116" height="10"/>
    <rect x="82" y="174" width="88" height="10"/>
    <rect x="302" y="118" width="116" height="10"/>
    <rect x="302" y="142" width="92" height="10"/>
    <rect x="522" y="176" width="116" height="10"/>
    <rect x="522" y="200" width="82" height="10"/>
  </g>
  <g opacity=".96">
    <polygon points="28,238 166,238 238,286 100,286" fill="#88BDA7"/>
    <polygon points="184,238 392,238 464,286 256,286" fill="#2E7D6B"/>
    <polygon points="410,238 692,238 692,286 482,286" fill="#0F4D3B"/>
  </g>
  <g fill="#172B3A" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">
    <text x="82" y="372">Institution A</text>
    <text x="302" y="372">Institution B</text>
    <text x="522" y="372">Institution C</text>
  </g>
  <g fill="#627078" font-family="Arial,Helvetica,sans-serif" font-size="12">
    <text x="82" y="392">local tenant · local rules</text>
    <text x="302" y="392">local tenant · local rules</text>
    <text x="522" y="392">local tenant · local rules</text>
  </g>
  <text x="360" y="270" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">shared layer · knowledge · tools · practice</text>
</svg>
