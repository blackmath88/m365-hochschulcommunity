<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Open source as a strategic choice, not a binary</title>
  <desc id="desc">A modular path shows reuse, openness, services and commercial options as part of one decision space.</desc>
  <rect width="760" height="520" fill="#EEF5F2"/>

  <g font-family="Arial,Helvetica,sans-serif">
    <text x="58" y="68" fill="#172B3A" font-size="18" font-weight="700">Strategischer Entscheidungsraum</text>
    <text x="58" y="96" fill="#627078" font-size="13">Nicht Open Source gegen kommerziell — sondern bewusst kombinieren.</text>
  </g>

  <g transform="translate(58 150)">
    <line x1="0" y1="110" x2="644" y2="110" stroke="#C9D3D0" stroke-width="2"/>

    <g transform="translate(0 0)">
      <polygon points="0,78 82,78 116,110 82,142 0,142 34,110" fill="#D7E8E1"/>
      <text x="58" y="105" text-anchor="middle" fill="#0F4D3B" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">REUSE</text>
      <text x="58" y="125" text-anchor="middle" fill="#627078" font-family="Arial,Helvetica,sans-serif" font-size="10">übernehmen</text>
    </g>

    <g transform="translate(126 0)">
      <polygon points="0,70 94,70 136,110 94,150 0,150 42,110" fill="#88BDA7"/>
      <text x="68" y="104" text-anchor="middle" fill="#0F4D3B" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">ADAPT</text>
      <text x="68" y="125" text-anchor="middle" fill="#0F4D3B" font-family="Arial,Helvetica,sans-serif" font-size="10">anpassen</text>
    </g>

    <g transform="translate(272 0)">
      <polygon points="0,62 106,62 154,110 106,158 0,158 48,110" fill="#2E7D6B"/>
      <text x="77" y="104" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">CONTRIBUTE</text>
      <text x="77" y="125" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="10">beitragen</text>
    </g>

    <g transform="translate(438 0)">
      <polygon points="0,72 82,72 120,110 82,148 0,148 38,110" fill="#0F4D3B"/>
      <text x="60" y="104" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">BUY</text>
      <text x="60" y="125" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="10">Services</text>
    </g>

    <g transform="translate(568 0)">
      <polygon points="0,82 54,82 78,110 54,138 0,138 24,110" fill="#E9E6F3"/>
      <text x="39" y="105" text-anchor="middle" fill="#172B3A" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">STOP</text>
      <text x="39" y="124" text-anchor="middle" fill="#627078" font-family="Arial,Helvetica,sans-serif" font-size="9">wenn nötig</text>
    </g>

    <g fill="#172B3A" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700">
      <text x="0" y="208">Offener Code</text>
      <text x="216" y="208">Gemeinsame Arbeit</text>
      <text x="430" y="208">Professionelle Leistungen</text>
    </g>
    <g fill="#627078" font-family="Arial,Helvetica,sans-serif" font-size="10">
      <text x="0" y="228">prüfen · lernen · wiederverwenden</text>
      <text x="216" y="228">testen · dokumentieren · entwickeln</text>
      <text x="430" y="228">Support · Integration · Betrieb</text>
    </g>
  </g>

  <g transform="translate(58 425)">
    <line x1="0" y1="0" x2="644" y2="0" stroke="#C9D3D0" stroke-width="1"/>
    <text x="0" y="30" fill="#0F4D3B" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">Open where it helps.</text>
    <text x="142" y="30" fill="#172B3A" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">Buy where it fits.</text>
    <text x="279" y="30" fill="#627078" font-family="Arial,Helvetica,sans-serif" font-size="12">Build only what adds value.</text>
  </g>
</svg>
